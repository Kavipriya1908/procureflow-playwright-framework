[pytest]
testpaths = tests
bdd_features_base_dir = features
addopts = --browser chromium --alluredir=reports/allure-results --clean-alluredir
markers =
    smoke: quick, most important checks
    regression: full test suite
    ui: browser tests
    api: API tests (no browser)
    negative: wrong input checks
    needs_credentials: needs VALID_EMAIL and VALID_PASSWORD in .env
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
